<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>💖 Forever & Always • Romantic Couple Portrait Animation 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Romantic Background Starfield & Floating Hearts -->
  <canvas id="ambient-canvas"></canvas>

  <main class="app-container">
    <!-- Top Romantic Header -->
    <header class="header-section">
      <div class="twin-hearts-wrapper" id="twin-hearts">
        <svg class="heart-svg left-heart" viewBox="0 0 32 32">
          <path d="M16,28.261c0,0-14-7.926-14-17.046c0-9.356,13.159-10.399,14-0.454c0.841-9.945,14-8.902,14,0.454 C30,20.335,16,28.261,16,28.261z" fill="url(#ruby-grad)"/>
          <defs>
            <linearGradient id="ruby-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff2a85"/>
              <stop offset="100%" stop-color="#be123c"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="center-sparkle">✦</div>
        <svg class="heart-svg right-heart" viewBox="0 0 32 32">
          <path d="M16,28.261c0,0-14-7.926-14-17.046c0-9.356,13.159-10.399,14-0.454c0.841-9.945,14-8.902,14,0.454 C30,20.335,16,28.261,16,28.261z" fill="url(#rose-grad)"/>
          <defs>
            <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fb7185"/>
              <stop offset="100%" stop-color="#e11d48"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <h1 class="title">Forever & Always</h1>
      <p class="subtitle" id="status-text">Act 1/3: Sketching Facial Silhouettes & Outlines...</p>
    </header>

    <!-- Main Art Canvas Frame -->
    <div class="portrait-card" id="portrait-card">
      <div class="gold-frame-glow"></div>
      <div class="canvas-wrapper">
        <canvas id="photo-canvas" width="620" height="452"></canvas>
        <canvas id="pen-canvas" width="620" height="452"></canvas>
        
        <!-- Live Virtual Pen / Paintbrush Nib -->
        <div class="artist-cursor" id="artist-cursor">
          <div class="cursor-nib"></div>
          <div class="cursor-glow"></div>
        </div>
      </div>
    </div>

    <!-- Romantic Calligraphy Ribbon -->
    <div class="ribbon-text">
      <span>💖 Two Hearts, One Beautiful Story • Forever & Always 💖</span>
    </div>

    <!-- Floating Interactive Controls Bar -->
    <nav class="controls-bar">
      <button class="btn" id="btn-replay" title="Replay Animation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span>Replay</span>
      </button>

      <button class="btn" id="btn-pause" title="Pause / Play">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="pause-icon">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
        <span id="pause-text">Pause</span>
      </button>

      <button class="btn" id="btn-speed" title="Speed Toggle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span id="speed-text">1x Speed</span>
      </button>

      <button class="btn" id="btn-music" title="Romantic Music Toggle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="music-icon">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <span id="music-text">Music: Off</span>
      </button>

      <button class="btn btn-primary" id="btn-download" title="Download Crystal-Clear Photo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Save Photo</span>
      </button>
    </nav>

    <footer class="footer-hint">
      ✦ Tap or click anywhere on the screen to send bursts of love hearts! ✦
    </footer>
  </main>

  <!-- Vector Contour Paths Data -->
  <script src="sketch_data.js"></script>
  <!-- Core Web Animation Engine -->
  <script src="script.js"></script>
</body>
</html>
